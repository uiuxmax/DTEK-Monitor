name: Apple Silicon fixture checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-probe:
    # Standard public-repository runner only: no private/larger-runner billing.
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out synthetic source export
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require native Apple Silicon
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - name: Build and check isolated core probe
        shell: bash
        run: /bin/bash tools/macos/check.sh --public-probe
      - name: Check isolated Network.framework HTTPS candidate
        shell: bash
        run: /bin/bash tools/macos/check-https.sh --network-candidate --public-probe
      - name: Build and test isolated fixture UI
        shell: bash
        run: /bin/bash tools/macos/check-ui.sh --public-probe
      - name: Check connected worker and session on owned TLS loopback
        shell: bash
        run: /bin/bash tools/macos/check-session.sh --public-probe
      - name: Check connected synthetic monitor UI and fake Login Items
        shell: bash
        run: /bin/bash tools/macos/check-monitor.sh --public-probe
      - name: Verify primary XCTest result independently
        shell: bash
        run: |
          reports=(out/macos/ui-check-*/test-summary.json)
          if test "${#reports[@]}" -ne 1 || ! test -f "${reports[0]}"; then exit 1; fi
          /usr/bin/xcrun swift tools/macos/verify-ui-result.swift "${reports[0]}" || exit 1
          monitors=(out/macos/monitor-ui-check-*/test-summary.json)
          if test "${#monitors[@]}" -ne 1 || ! test -f "${monitors[0]}"; then exit 1; fi
          /usr/bin/xcrun swift tools/macos/verify-ui-result.swift "${monitors[0]}" 8 || exit 1
      - name: Print bounded verification evidence
        if: always()
        shell: bash
        run: |
          for report in out/macos/doctor-*/environment.txt out/macos/check-*/*.json out/macos/check-*/probe.log out/macos/check-*/restart.log out/macos/check-*/build.log out/macos/ui-check-*/*.json out/macos/ui-check-*/summary*.log out/macos/ui-check-*/build.log out/macos/ui-check-*/tests.log; do
            if test -f "$report"; then
              printf '\nReport: %s\n' "$report"
              tail -n 100 "$report"
              case "$report" in
                */probe.log) awk '/^FAIL |Data probe failed|Lookup probe failed/ { if (++count <= 40) print }' "$report" ;;
                */tests.log) awk '/error:|Test Case .* failed/ { if (++count <= 40) print }' "$report" ;;
              esac
            fi
          done
          for report in out/macos/https-check-*/build.log out/macos/https-check-*/production-build.log out/macos/https-check-*/resources.log out/macos/https-check-*/parser.log out/macos/https-check-*/lifecycle.log out/macos/https-check-*/wire.log out/macos/https-check-*/results.json; do
            if test -f "$report"; then
              printf '\nReport: %s\n' "$report"
              case "$report" in
                */results.json) cat "$report" ;;
                *) tail -n 100 "$report" ;;
              esac
            fi
          done
          for report in out/macos/session-check-*/production-build.log out/macos/session-check-*/session.log out/macos/session-check-*/runner.log out/macos/session-check-*/results.json; do
            if test -f "$report"; then
              printf '\nReport: %s\n' "$report"
              tail -n 100 "$report"
            fi
          done
          printf '%s\n' 'Apple Silicon core and synthetic UI: see the build/check steps and reports in this log. Physical display and VoiceOver acceptance remain manual.' >> "$GITHUB_STEP_SUMMARY"
          for report in out/macos/monitor-ui-check-*/*.json out/macos/monitor-ui-check-*/build.log out/macos/monitor-ui-check-*/release-build.log out/macos/monitor-ui-check-*/login.log out/macos/monitor-ui-check-*/tests.log; do
            if test -f "$report"; then
              printf '\nReport: %s\n' "$report"
              tail -n 100 "$report"
              case "$report" in
                */build.log|*/release-build.log|*/tests.log) awk '/error:|Test Case .* failed/ { if (++count <= 40) print }' "$report" ;;
              esac
            fi
          done
